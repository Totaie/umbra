name: Arch package

# Builds the Arch Linux package and publishes it to a pacman repository hosted on
# the "arch" release, so that an Arch user gets Umbra updates from `pacman -Syu`
# along with everything else on their system.
#
# It runs when the version or the packaging changes. app/version.txt is what the
# Windows release is cut from, so pushing the version bump to umbra-v2 is what
# ships that same version to Arch. Any other branch builds the package and keeps
# it as an artifact without publishing, which is how to try a packaging change.
#
# There is no manual trigger because GitHub only offers one for workflows on the
# default branch, and that is upstream's master. To republish without a new
# version - after Arch moves to a new FFmpeg or libplacebo, say - bump pkgrel in
# packaging/arch/PKGBUILD and push.

on:
  push:
    paths:
      - app/version.txt
      - packaging/**
      - .github/workflows/arch-package.yml

concurrency:
  group: arch-package-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  package:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
    # Before checkout: without git in the container, actions/checkout falls back to
    # downloading an archive, and an archive has no submodules to update.
    - name: Install git
      run: pacman -Syu --noconfirm --needed git github-cli

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Fetch submodules
      run: |
        git config --global --add safe.directory '*'

        # third-party/AMF is left out: only the Windows build compiles it.
        git submodule update --init app/SDL_GameControllerDB qmdnsengine/qmdnsengine

        # umbra-v2 pins moonlight-common-c at a commit that was made in one working
        # copy and never pushed, so a clean clone cannot fetch it. Until the pin
        # names something published, fall back to the last commit that is, plus the
        # one change the missing commit made. Once the pin is fixed the first
        # command succeeds and none of the fallback runs.
        common=moonlight-common-c/moonlight-common-c
        if ! git submodule update --init "$common"; then
          echo "::warning::moonlight-common-c pin is not fetchable; using 7bfa0c1e plus packaging/patches"
          git -C "$common" checkout 7bfa0c1e79d55871c519287c441a629b9eeed045
          git -C "$common" apply "$GITHUB_WORKSPACE/packaging/patches/moonlight-common-c-optional-mic.patch"
        fi
        git -C "$common" submodule update --init --recursive

    - name: Build package
      run: |
        # makepkg refuses to run as root, and --syncdeps needs to install through sudo.
        useradd --create-home builder
        echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
        mkdir -p dist
        chown -R builder: .

        cd packaging/arch
        sudo -u builder env MAKEFLAGS="-j$(nproc)" BUILDDIR=/tmp/makepkg PKGDEST="$GITHUB_WORKSPACE/dist" \
          makepkg --syncdeps --noconfirm

    - name: Check the package installs and links
      run: |
        pacman -U --noconfirm dist/umbra-*.pkg.tar.zst
        pacman -Ql umbra

        # A library the package forgot to depend on shows up here as "not found".
        if ldd /usr/bin/umbra /usr/bin/moonlight-clipboard-helper | grep 'not found'; then
          exit 1
        fi

    # Informational. There is no display or GPU here, so this cannot say the app
    # works, but a QML type error or a missing Qt module shows up in this log,
    # and those are fatal at startup while compiling perfectly cleanly.
    - name: Start it once
      continue-on-error: true
      run: |
        status=0
        QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy \
          timeout 20 umbra || status=$?
        echo "exit status: $status (124 means it was still running when stopped)"

    - name: Upload package
      uses: actions/upload-artifact@v4
      with:
        name: umbra-arch-package
        path: dist/*.pkg.tar.zst

    - name: Publish to the pacman repository
      if: github.ref == 'refs/heads/umbra-v2'
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        cd dist
        pkg=$(ls umbra-*.pkg.tar.zst)

        repo-add umbra.db.tar.gz "$pkg"
        # repo-add leaves umbra.db and umbra.files as symlinks to the archives. A
        # release asset has to be a real file, and these two names are the ones
        # pacman asks the server for.
        rm umbra.db umbra.files
        cp umbra.db.tar.gz umbra.db
        cp umbra.files.tar.gz umbra.files

        cat > notes.md <<EOF
        This is not a version of Umbra. It is a pacman repository: the files below are
        the current Arch Linux package and the database pacman reads, and they are
        replaced each time Umbra is released.

        **Set up once**

            printf '\n[umbra]\nSigLevel = Optional TrustAll\nServer = https://github.com/$GH_REPO/releases/download/arch\n' | sudo tee -a /etc/pacman.conf
            sudo pacman -Syu umbra

        **After that** there is nothing to do. Umbra updates with the rest of the
        system on \`sudo pacman -Syu\`, or through whatever you already use for that.

        The packages are not signed, which is what \`SigLevel = Optional TrustAll\`
        allows for this one repository. They are built from this repository's source
        by the Arch package workflow and downloaded over HTTPS from GitHub.

        Currently published: \`$pkg\`
        EOF

        if gh release view arch > /dev/null 2>&1; then
          gh release edit arch --notes-file notes.md
        else
          # --latest=false keeps this off the repository's "Latest release" badge.
          # Umbra's own update check skips it either way: it only considers tags
          # that parse as a version number.
          gh release create arch --target "$GITHUB_SHA" --latest=false \
            --title 'Umbra for Arch Linux' --notes-file notes.md
        fi

        # Package first, database second, so the database never names a file that
        # is not there yet.
        gh release upload arch "$pkg" --clobber
        gh release upload arch umbra.db umbra.files --clobber

        # The database only lists the newest build, so older ones are dead weight.
        gh release view arch --json assets --jq '.assets[].name | select(endswith(".pkg.tar.zst"))' |
          while read -r old; do
            if [ "$old" != "$pkg" ]; then
              gh release delete-asset arch "$old" --yes
            fi
          done
